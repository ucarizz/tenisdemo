version: '3.8'

services:
  tenis_db:
    image: postgres:16-alpine
    container_name: tenis_db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: tenisdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: tenis_opensearch
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:5.0
    container_name: tenis_mongodb
    volumes:
      - mongodb_data:/data/db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  graylog:
    image: graylog/graylog:5.2
    container_name: tenis_graylog
    depends_on:
      - opensearch
      - mongodb
    environment:
      - GRAYLOG_NODE_ID_FILE=/usr/share/graylog/data/config/node-id
      - GRAYLOG_PASSWORD_SECRET=secret_must_be_at_least_16_characters_long
      # Admin password: admin (SHA-256 of 'admin')
      - GRAYLOG_ROOT_PASSWORD_SHA2=8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      - GRAYLOG_HTTP_BIND_ADDRESS=0.0.0.0:9000
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
      - GRAYLOG_MONGODB_URI=mongodb://mongodb:27017/graylog
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - graylog_data:/usr/share/graylog/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tenis_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenis_api
    ports:
      - "5200:5200"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=tenis_db;Port=5432;Database=tenisdb;Username=postgres;Password=password
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
      - SmtpSettings__Host=smtp.resend.com
      - SmtpSettings__Port=587
      - SmtpSettings__Username=resend
      - SmtpSettings__Password=${SMTP_PASSWORD}
      - SmtpSettings__EnableSsl=true
      - SmtpSettings__FromAddress=noreply@courtmate.com.tr
      - SmtpSettings__FromName=CourtMate
    depends_on:
      - tenis_db
      - graylog
    volumes:
      - uploads_data:/app/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  opensearch_data:
  mongodb_data:
  graylog_data:
  uploads_data:
